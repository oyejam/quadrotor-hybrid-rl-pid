# Training config for the pure-PPO controller baseline.
# Loaded by scripts/train_ppo.py

env:
  name: TrajTrackAviary          # custom circular-trajectory-tracking env (src/envs/)
  ctrl_freq_hz: 48
  pyb_freq_hz: 240
  episode_len_sec: 10             # one period of the circular trajectory
  action_type: rpm                # raw motor RPM actions (gym_pybullet_drones ActionType)
  obs_type: kin                   # kinematic state observation

domain_randomization:
  enabled: true
  mass_scale_range: [0.9, 1.1]    # uniform multiplier on nominal drone mass (±10%)

training:
  algo: PPO
  policy: MlpPolicy
  total_timesteps: 2000000        # phase 2 (docs/gpu_machine_plan.md): up from the Mac's 500000
  n_envs: 16                      # phase 2: up from 2, leaving headroom on this 16-core/24-thread CPU
  device: cpu                     # phase 2: benchmarked cpu vs cuda for this MLP policy, see docs/gpu_machine_plan.md
  seed: 0                         # phase 2 seed sweep (0,1,2) overrides this via --seed, see scripts/train_ppo.py
  eval_freq: 5000
  n_eval_episodes: 5

logging:
  output_dir: results/ppo
  tensorboard: true
