# Training config for the hybrid (PID + RL-residual) controller.
# Loaded by scripts/train_hybrid.py
# Same env/training budget as config/ppo.yaml so the two are comparable.

env:
  name: TrajTrackAviary
  ctrl_freq_hz: 48
  pyb_freq_hz: 240
  episode_len_sec: 10
  action_type: rpm
  obs_type: kin

domain_randomization:
  enabled: true
  mass_scale_range: [0.9, 1.1]

hybrid:
  residual_clip_fraction: 0.2     # residual action clipped to ±20% of PID's RPM output
  pid_drone_model: cf2x

training:
  algo: PPO
  policy: MlpPolicy
  total_timesteps: 2000000        # phase 2 (docs/gpu_machine_plan.md): up from the Mac's 500000
  n_envs: 16                      # phase 2: up from 2, leaving headroom on this 16-core/24-thread CPU
  device: cpu                     # phase 2: benchmarked cpu vs cuda for this MLP policy, see docs/gpu_machine_plan.md
  seed: 0                         # phase 2 seed sweep (0,1,2) overrides this via --seed, see scripts/train_hybrid.py
  eval_freq: 5000
  n_eval_episodes: 5

logging:
  output_dir: results/hybrid
  tensorboard: true
